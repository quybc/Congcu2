<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">
<main class="auth-container">
    <section class="auth-card">
        <h1 class="auth-title">Đăng ký tài khoản</h1>
        <p class="auth-subtitle">Tạo tài khoản để mua sắm nhanh hơn</p>

        <p class="auth-alert auth-alert-error" th:if="${error}" th:text="${error}"></p>

        <form class="auth-form" th:action="@{/register}" method="post">
            <div class="field-group">
                <label class="field-label" for="username">Tên đăng nhập</label>
                <input class="field-input" id="username" name="username" type="text" th:value="${username}" required>
            </div>
            <div class="field-group">
                <label class="field-label" for="email">Gmail</label>
                <input class="field-input" id="email" name="email" type="email" th:value="${email}" placeholder="example@gmail.com" required>
            </div>
            <div class="field-group">
                <label class="field-label" for="password">Mật khẩu</label>
                <input class="field-input" id="password" name="password" type="password" required>
            </div>
            <div class="field-group">
                <label class="field-label" for="confirmPassword">Xác nhận mật khẩu</label>
                <input class="field-input" id="confirmPassword" name="confirmPassword" type="password" required>
            </div>
            <button class="auth-button" type="submit">Đăng ký</button>
        </form>

        <p class="auth-switch">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a></p>
    </section>
</main>
</body>
</html>
