<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">
<main class="auth-container">
    <section class="auth-card">
        <h1 class="auth-title">Đăng nhập</h1>
        <p class="auth-subtitle">Chào mừng bạn quay lại cửa hàng</p>

        <p class="auth-alert auth-alert-error" th:if="${param.error}">Sai tên đăng nhập hoặc mật khẩu</p>
        <p class="auth-alert auth-alert-success" th:if="${param.logout}">Bạn đã đăng xuất</p>
        <p class="auth-alert auth-alert-success" th:if="${param.registered}">Đăng ký thành công, vui lòng đăng nhập</p>

        <form class="auth-form" th:action="@{/login}" method="post">
            <div class="field-group">
                <label class="field-label" for="username">Tên đăng nhập</label>
                <input class="field-input" id="username" name="username" type="text" required>
            </div>
            <div class="field-group">
                <label class="field-label" for="password">Mật khẩu</label>
                <input class="field-input" id="password" name="password" type="password" required>
            </div>
            <button class="auth-button" type="submit">Đăng nhập</button>
        </form>

        <p class="auth-switch">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a></p>
    </section>
</main>
</body>
</html>
