<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý khuyến mãi đổi điểm</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="tgdd-header">
        <div class="header-container">
            <a href="/" class="logo-wrapper">
                <div class="logo-tgdd"><i class="fas fa-mobile-alt"></i> thegioididong<span style="font-size: 10px;">.com</span></div>
            </a>
            <div class="header-right d-flex align-items-center gap-3">
                <a href="/" class="header-link-item">
                    <div class="link-text"><i class="fas fa-home"></i> Trang chủ</div>
                </a>
            </div>
        </div>
    </header>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">Quản lý khuyến mãi đổi điểm</h3>
            <a href="/promotions/new" class="btn btn-primary"><i class="fas fa-plus me-1"></i> Thêm khuyến mãi</a>
        </div>

        <div class="alert alert-success" th:if="${successMessage != null}" th:text="${successMessage}"></div>

        <div class="table-responsive bg-white shadow-sm rounded p-3">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Mã</th>
                        <th>Tên</th>
                        <th>Điểm đổi</th>
                        <th>Giảm giá</th>
                        <th>Số lượng</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="voucher : ${vouchers}">
                        <td th:text="${voucher.id}"></td>
                        <td class="fw-bold text-primary" th:text="${voucher.code}"></td>
                        <td th:text="${voucher.name}"></td>
                        <td th:text="${voucher.pointsRequired}"></td>
                        <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(voucher.discountAmount, 0, 'COMMA', 0, 'POINT') + '₫'}"></td>
                        <td th:text="${voucher.quantity}"></td>
                        <td>
                            <span class="badge bg-success" th:if="${voucher.active}">Đang áp dụng</span>
                            <span class="badge bg-secondary" th:if="${!voucher.active}">Tạm khóa</span>
                        </td>
                        <td>
                            <a th:href="@{/promotions/edit/{id}(id=${voucher.id})}" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
                            <a th:href="@{/promotions/delete/{id}(id=${voucher.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Bạn có chắc muốn xóa khuyến mãi này?')"><i class="fas fa-trash"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${vouchers.isEmpty()}">
                        <td colspan="8" class="text-center py-4">Chưa có khuyến mãi nào</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
