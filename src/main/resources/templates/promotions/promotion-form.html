<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thông tin khuyến mãi đổi điểm</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container mt-5" style="max-width: 760px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white py-3">
            <h4 class="mb-0" th:text="${voucher.id == null ? '➕ Thêm khuyến mãi đổi điểm' : '✏️ Cập nhật khuyến mãi đổi điểm'}"></h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/promotions/save}" th:object="${voucher}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Mã voucher:</label>
                    <input type="text" th:field="*{code}" class="form-control" placeholder="VD: VIP50K">
                    <small class="text-danger" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Tên khuyến mãi:</label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="VD: Đổi 100 điểm lấy 50.000đ">
                    <small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Điểm cần đổi:</label>
                        <input type="number" th:field="*{pointsRequired}" min="1" class="form-control">
                        <small class="text-danger" th:if="${#fields.hasErrors('pointsRequired')}" th:errors="*{pointsRequired}"></small>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Giá trị giảm (₫):</label>
                        <input type="number" th:field="*{discountAmount}" min="1000" class="form-control">
                        <small class="text-danger" th:if="${#fields.hasErrors('discountAmount')}" th:errors="*{discountAmount}"></small>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Số lượng voucher:</label>
                        <input type="number" th:field="*{quantity}" min="0" class="form-control">
                        <small class="text-danger" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></small>
                    </div>
                    <div class="col-md-6 mb-3 d-flex align-items-center">
                        <div class="form-check form-switch mt-4">
                            <input class="form-check-input" type="checkbox" th:field="*{active}">
                            <label class="form-check-label">Kích hoạt</label>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Mô tả:</label>
                    <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Mô tả ngắn cho khuyến mãi"></textarea>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="fas fa-save me-1"></i> Lưu
                    </button>
                    <a href="/promotions" class="btn btn-secondary px-4">
                        <i class="fas fa-times me-1"></i> Hủy
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
