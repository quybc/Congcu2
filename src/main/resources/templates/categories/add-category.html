<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container mt-5" style="max-width: 620px;">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white py-3">
            <h4 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Thêm danh mục mới</h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/categories/add}" th:object="${category}" method="post" enctype="multipart/form-data">

                <!-- Tên danh mục -->
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Tên danh mục:</label>
                    <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Nhập tên danh mục">
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger mt-1"></div>
                </div>

                <!-- Hidden field cho parentCategory (tự động cập nhật qua JS) -->
                <input type="hidden" th:field="*{parentCategory}" id="parentCategory">

                <!-- Phân cấp lớp -->
                <div class="mb-2 p-3 rounded" style="background:#f8f9fa;border:1px solid #dee2e6;">
                    <div class="fw-semibold mb-2" style="font-size:13px;color:#555;">📂 Chọn vị trí danh mục (chọn từ trên xuống):</div>

                    <!-- Lớp 1 -->
                    <div class="mb-2">
                        <label class="form-label fw-semibold text-danger" style="font-size:13px;">
                            <i class="fas fa-circle me-1" style="font-size:8px;"></i> Lớp 1 — Danh mục gốc:
                        </label>
                        <select id="sel1" class="form-select form-select-sm" onchange="onL1Change()">
                            <option value="">-- Không chọn (category độc lập) --</option>
                            <option value="Điện thoại">📱 Điện thoại</option>
                            <option value="Laptop">💻 Laptop</option>
                            <option value="Phụ kiện">🎧 Phụ kiện</option>
                            <option value="Smartwatch">⌚ Smartwatch</option>
                            <option value="Đồng hồ">🕐 Đồng hồ</option>
                            <option value="Tablet">📲 Tablet</option>
                            <option value="Máy cũ Thu cũ">♻️ Máy cũ Thu cũ</option>
                            <option value="Màn hình máy in">🖨️ Màn hình máy in</option>
                            <option value="Sim Thẻ Cào">📶 Sim Thẻ Cào</option>
                            <option value="Dịch vụ tiện ích">🛠️ Dịch vụ tiện ích</option>
                        </select>
                    </div>

                    <!-- Lớp 2 -->
                    <div class="mb-2" id="box2" style="display:none;">
                        <label class="form-label fw-semibold" style="font-size:13px;color:#d07000;">
                            <i class="fas fa-circle me-1" style="font-size:8px;"></i> Lớp 2 — Nhóm con:
                            <small class="text-muted fw-normal">(bỏ qua = tạo mới lớp 2)</small>
                        </label>
                        <select id="sel2" class="form-select form-select-sm" onchange="onL2Change()">
                            <option value="">-- Không chọn (tạo mới lớp 2) --</option>
                        </select>
                    </div>

                    <!-- Lớp 3 -->
                    <div class="mb-0" id="box3" style="display:none;">
                        <label class="form-label fw-semibold" style="font-size:13px;color:#28a745;">
                            <i class="fas fa-circle me-1" style="font-size:8px;"></i> Lớp 3 — Mục chi tiết:
                            <small class="text-muted fw-normal">(bỏ qua = tạo mới lớp 3)</small>
                        </label>
                        <select id="sel3" class="form-select form-select-sm" onchange="onL3Change()">
                            <option value="">-- Không chọn (tạo mới lớp 3) --</option>
                        </select>
                    </div>

                    <!-- Kết quả parentCategory -->
                    <div class="mt-2 pt-2 border-top" id="resultBox" style="display:none;">
                        <small class="text-muted">📌 parentCategory sẽ là:</small>
                        <strong id="resultLabel" class="ms-1" style="color:#0066cc;"></strong>
                    </div>
                </div>

                <!-- Hình ảnh -->
                <div class="mb-3">
                    <label for="imageCategory" class="form-label fw-semibold">Hình ảnh danh mục:</label>
                    <input type="file" name="imageCategory" class="form-control" id="imageCategory" accept="image/*" onchange="previewImage(this)">
                    <div class="mt-2" id="imgPreviewBox" style="display:none;">
                        <p class="text-muted mb-1" style="font-size:13px;">Xem trước:</p>
                        <img id="imgPreview" src="#" style="max-height:80px; border-radius:8px; border:1px solid #ddd; padding:3px;">
                    </div>
                    <div class="form-text text-muted">Upload ảnh PNG/JPG (tùy chọn).</div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-success px-4">
                        <i class="fas fa-save me-1"></i> Lưu
                    </button>
                    <a href="/categories" class="btn btn-secondary px-4">
                        <i class="fas fa-times me-1"></i> Hủy
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const allCats = /*[[${allCategories}]]*/ [];
    const LEVEL1 = ["Điện thoại","Laptop","Phụ kiện","Smartwatch","Đồng hồ","Tablet","Máy cũ Thu cũ","Màn hình máy in","Sim Thẻ Cào","Dịch vụ tiện ích"];

    const sel1 = document.getElementById('sel1');
    const sel2 = document.getElementById('sel2');
    const sel3 = document.getElementById('sel3');
    const box2 = document.getElementById('box2');
    const box3 = document.getElementById('box3');
    const resultBox = document.getElementById('resultBox');
    const resultLabel = document.getElementById('resultLabel');
    const parentInput = document.getElementById('parentCategory');

    function filterCats(parentName) {
        return allCats.filter(c => c.parentCategory === parentName);
    }

    function fillSelect(sel, cats, placeholder) {
        sel.innerHTML = `<option value="">${placeholder}</option>`;
        cats.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.name;
            opt.textContent = c.name;
            sel.appendChild(opt);
        });
    }

    function updateParent() {
        let val = '';
        if (sel3.value) val = sel3.value;
        else if (sel2.value) val = sel2.value;
        else if (sel1.value) val = sel1.value;
        parentInput.value = val;
        if (val) {
            resultLabel.textContent = '"' + val + '"';
            resultBox.style.display = 'block';
        } else {
            resultBox.style.display = 'none';
        }
    }

    function onL1Change() {
        const l1 = sel1.value;
        box2.style.display = 'none';
        box3.style.display = 'none';
        if (l1) {
            const l2Cats = filterCats(l1);
            if (l2Cats.length > 0) {
                fillSelect(sel2, l2Cats, '-- Không chọn (tạo mới lớp 2) --');
                box2.style.display = 'block';
            }
        }
        updateParent();
    }

    function onL2Change() {
        const l2 = sel2.value;
        box3.style.display = 'none';
        if (l2) {
            const l3Cats = filterCats(l2);
            if (l3Cats.length > 0) {
                fillSelect(sel3, l3Cats, '-- Không chọn (tạo mới lớp 3) --');
                box3.style.display = 'block';
            }
        }
        updateParent();
    }

    function onL3Change() { updateParent(); }

    function previewImage(input) {
        const box = document.getElementById('imgPreviewBox');
        const preview = document.getElementById('imgPreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { preview.src = e.target.result; box.style.display = 'block'; };
            reader.readAsDataURL(input.files[0]);
        } else { box.style.display = 'none'; }
    }
</script>
</body>
</html>
