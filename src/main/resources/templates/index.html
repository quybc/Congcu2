<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #0a0f1f;
            --bg-2: #163a5f;
            --bg-3: #2d6a4f;
            --text: #f8fafc;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Be Vietnam Pro", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 20% 20%, rgba(45, 106, 79, 0.5), transparent 40%),
                radial-gradient(circle at 80% 30%, rgba(22, 58, 95, 0.6), transparent 45%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
            padding: 24px;
        }

        .card {
            width: min(760px, 100%);
            border: 1px solid rgba(248, 250, 252, 0.25);
            border-radius: 24px;
            background: rgba(10, 15, 31, 0.5);
            backdrop-filter: blur(6px);
            padding: 36px 28px;
            text-align: center;
            animation: rise 700ms ease-out both;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 4.2rem);
            font-weight: 800;
            letter-spacing: 0.02em;
            line-height: 1.2;
            text-transform: uppercase;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Chao cac ban, toi la Quy</h1>
    </main>
</body>
</html>
