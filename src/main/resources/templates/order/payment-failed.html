<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thanh toán thất bại</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-danger text-white py-3">
            <h4 class="mb-0">❌ Không thể tạo thanh toán MoMo</h4>
        </div>
        <div class="card-body p-4">
            <p class="mb-2" th:text="${error}">Lỗi tạo giao dịch MoMo.</p>
            <p class="mb-4" th:if="${order != null}">
                Mã đơn hàng: <strong th:text="${order.id}"></strong>
            </p>
            <div class="d-flex gap-2">
                <a href="/cart" class="btn btn-primary">Quay lại giỏ hàng</a>
                <a href="/" class="btn btn-outline-secondary">Về trang chủ</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
